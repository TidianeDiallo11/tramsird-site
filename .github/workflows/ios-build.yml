name: Build iOS (vérification)

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "capacitor.config.ts"
      - "resources/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    # Xcode/CocoaPods n'existent que sur macOS : impossible de valider ce
    # projet depuis l'environnement Linux où le code est écrit, d'où ce
    # runner macOS dédié.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm ci

      - name: Ajouter la plateforme iOS si absente
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Compiler pour le simulateur (sans signature)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build
