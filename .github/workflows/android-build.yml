name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "resources/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Les runners ubuntu-latest de GitHub embarquent déjà le SDK Android
      # (ANDROID_HOME préconfiguré) : android-actions/setup-android essayait
      # d'installer le paquet "tools", retiré des dépôts Google depuis des
      # années, et échouait systématiquement.
      - name: Compiler l'APK de debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: nl-trading-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
